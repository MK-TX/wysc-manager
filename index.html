<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>文游素材管理</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#6366f1;--primary-dark:#4f46e5;--primary-light:#e0e7ff;
  --bg:#f0f2f5;--card:#fff;--text:#1e293b;--text2:#64748b;
  --border:#e2e8f0;--danger:#ef4444;--danger-bg:#fef2f2;
  --warning:#f59e0b;--warning-bg:#fffbeb;--success:#10b981;--success-bg:#ecfdf5;
  --radius:12px;--radius-sm:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
button{cursor:pointer;font-family:inherit;font-size:inherit;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:16px}

.app-header{background:var(--card);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.app-header h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.app-header h1 svg{width:24px;height:24px;color:var(--primary)}
.header-actions{display:flex;gap:6px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 12px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;transition:all .15s;border:1px solid var(--border);background:var(--card);color:var(--text)}
.btn:hover{background:#f8fafc}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-danger{color:var(--danger);border-color:#fecaca}
.btn-danger:hover{background:var(--danger-bg)}
.btn-sm{padding:6px 10px;font-size:12px}
.btn-icon{padding:6px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;min-width:32px;min-height:32px}
.btn-icon:hover{background:#f1f5f9}
.btn-icon.del:hover{color:var(--danger);background:var(--danger-bg)}

.data-banner{background:var(--warning-bg);border-bottom:1px solid #fde68a;padding:8px 20px;display:flex;align-items:center;gap:8px;font-size:13px;color:#92400e}
.data-banner svg{width:16px;height:16px;flex-shrink:0}
.data-banner .cls{color:#92400e;margin-left:auto;cursor:pointer}

.app-body{display:flex;height:calc(100vh - 56px);overflow:hidden}

/* Sidebar */
.sidebar{width:270px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-tabs{display:flex;border-bottom:1px solid var(--border)}
.sidebar-tab{flex:1;padding:11px 8px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;background:var(--card);transition:all .15s;color:var(--text2)}
.sidebar-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.sidebar-tab:hover{background:#f8fafc}
.sidebar-tab .stc{font-size:10px;color:var(--text2);font-weight:400;display:block;margin-top:1px}
.sidebar-list{flex:1;overflow-y:auto;padding:4px}
.sidebar-group{margin-bottom:2px}
.sidebar-group-header{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:var(--radius-sm);cursor:pointer;user-select:none;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;transition:background .15s;margin-top:4px}
.sidebar-group-header:hover{background:#f1f5f9}
.sidebar-group-header.active{color:var(--primary-dark);background:var(--primary-light)}
.sidebar-group-header .sarw{transition:transform .15s;width:12px;height:12px;flex-shrink:0}
.sidebar-group-header .sarw.open{transform:rotate(90deg)}
.sidebar-group-header .gn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:none;letter-spacing:0}
.sidebar-group-header .gc{font-size:10px;color:var(--text2);background:#f1f5f9;padding:1px 6px;border-radius:10px;flex-shrink:0;font-weight:400;letter-spacing:0}
.sidebar-group-header.active .gc{background:var(--primary);color:#fff}
.sidebar-group-items{margin-left:0}
.sidebar-group-items.collapsed{display:none}

.sidebar-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:background .15s;margin-bottom:1px;user-select:none;position:relative;font-size:13px}
.sidebar-item:hover{background:#f1f5f9}
.sidebar-item.active{background:var(--primary-light);color:var(--primary-dark);font-weight:600}
.sidebar-item.dragging{opacity:0.5;background:#e0e7ff}
.sidebar-item.drag-over{border:2px dashed var(--primary);border-radius:var(--radius-sm)}
.sidebar-group-header.dragging{opacity:0.5;background:#e0e7ff}
.sidebar-group-header.drag-over{border:2px dashed var(--primary);border-radius:var(--radius-sm)}

.sidebar-item .sgrip{flex-shrink:0;cursor:grab;color:var(--text2);opacity:0;transition:opacity .15s;display:flex;align-items:center}
.sidebar-item:hover .sgrip{opacity:0.6}
.sidebar-item .sgrip:active{cursor:grabbing}
.sidebar-item svg.si-icon{width:16px;height:16px;flex-shrink:0}
.sidebar-item .sn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-item .sc{font-size:10px;color:var(--text2);background:#f1f5f9;padding:1px 6px;border-radius:10px;flex-shrink:0}
.sidebar-item.active .sc{background:var(--primary);color:#fff}
.sidebar-item .sd{opacity:0;transition:opacity .15s;flex-shrink:0;color:var(--text2)}
.sidebar-item:hover .sd{opacity:1}
.sidebar-item .sd:hover{color:var(--danger)}
.sidebar-item.pinned{border-left:3px solid var(--warning);padding-left:7px}
.sidebar-section-label{padding:6px 10px;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px;cursor:pointer;border-radius:var(--radius-sm);transition:background .15s;margin-top:4px}
.sidebar-section-label:hover{background:#f1f5f9}
.sidebar-section-label.active{color:var(--primary-dark);background:var(--primary-light)}
.sidebar-section-label .ssl-count{font-size:10px;color:var(--text2);background:#f1f5f9;padding:1px 6px;border-radius:10px;font-weight:400;letter-spacing:0;margin-left:auto}
.sidebar-section-label.active .ssl-count{background:var(--primary);color:#fff}
.sidebar-item.multiselect{background:#dbeafe;box-shadow:inset 3px 0 0 var(--primary)}
.sidebar-section-label.drag-over,.sidebar-group-header.drag-over-src{background:var(--primary-light);outline:2px dashed var(--primary);outline-offset:-2px}
.sidebar-section-items{padding-left:0}
.sidebar-section-divider{height:1px;background:var(--border);margin:4px 8px}
.sidebar-footer{padding:8px 10px;border-top:1px solid var(--border);display:flex;gap:6px}
.sidebar-footer .btn{flex:1;justify-content:center}

/* Context Menu */
.ctx-menu{position:fixed;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:500;min-width:170px;padding:4px;display:none}
.ctx-item{padding:9px 14px;font-size:13px;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:8px;transition:background .1s}
.ctx-item:hover{background:#f1f5f9}
.ctx-item.danger{color:var(--danger)}
.ctx-divider{height:1px;background:var(--border);margin:4px 0}
.ctx-item svg{width:15px;height:15px;flex-shrink:0}

/* Main */
.main-content{flex:1;overflow-y:auto;padding:16px 20px}
.main-content::-webkit-scrollbar{width:6px}
.main-content::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}

.ov-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.ovc{background:var(--card);border-radius:var(--radius);padding:14px 16px;border:1px solid var(--border)}
.ovc .ovl{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:5px;margin-bottom:6px}
.ovc .ovl svg{width:14px;height:14px}
.ovc .ovv{font-size:22px;font-weight:700}
.ovv.warn{color:var(--warning)}.ovv.ok{color:var(--success)}.ovv.mny{color:var(--primary)}.ovv.mny2{color:#8b5cf6}

.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.scard{background:var(--card);border-radius:var(--radius);padding:14px 16px;border:1px solid var(--border)}
.scard h3{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.scard h3 svg{width:15px;height:15px;color:var(--primary)}
.chart-wrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.chart-wrap svg{flex-shrink:0}
.legend{flex:1;min-width:100px;max-height:260px;overflow-y:auto}
.litem{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12px;cursor:pointer}
.litem:hover{opacity:.7}
.ldot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.llb{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvl{font-weight:600}
.bars{display:flex;flex-direction:column;gap:8px}
.brow{display:flex;align-items:center;gap:8px}
.blb{width:90px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.btk{flex:1;height:26px;background:#f1f5f9;border-radius:6px;overflow:hidden}
.bfi{height:100%;background:var(--primary);border-radius:6px;display:flex;align-items:center;padding-left:8px;color:#fff;font-size:11px;font-weight:600;transition:width .3s;white-space:nowrap}
.emp{font-size:13px;color:var(--text2);padding:12px 0;text-align:center}

.mat-sec{background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid var(--border)}
.mat-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.mat-hd .mht{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.mht .src-badge{font-size:12px;color:var(--text2);font-weight:400}
.mat-fl{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.mat-fl select,.mat-fl input{padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--card)}
.mat-fl input{width:140px}
.swrap{position:relative}
.swrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text2)}
.swrap input{padding-left:30px}

.mat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:box-shadow .15s,transform .15s}
.mc:hover{box-shadow:0 3px 12px rgba(0,0,0,.07);transform:translateY(-2px)}
.mci{width:100%;height:150px;background:#f1f5f9;cursor:pointer;position:relative;overflow:hidden}
.mci img{width:100%;height:100%;object-fit:cover}
.mci .mpl{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#cbd5e1}
.mci .mpl svg{width:40px;height:40px}
.mci .img-count{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:2px 6px;border-radius:8px;font-weight:600}
.mci .img-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.4);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;opacity:0;transition:opacity .15s}
.mci:hover .img-nav{opacity:1}
.mci .img-nav.prev{left:6px}
.mci .img-nav.next{right:6px}
.mci .img-nav svg{width:14px;height:14px}
.mcb{padding:11px}
.mc-name{font-size:14px;font-weight:700;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mct{display:flex;flex-direction:column;align-items:flex-start;gap:3px;margin-bottom:4px}
.mcp{font-size:15px;font-weight:700;color:var(--danger);white-space:nowrap}
.mc-cat{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px}
/* Separate tags: sub-cat gets its own style */

.mca{font-size:11px;color:var(--text2);margin-bottom:4px}
.tag-row{display:flex;gap:4px;flex-wrap:wrap;align-items:center;width:100%;margin:0}
.mcbg{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500;line-height:1.5;white-space:nowrap;background:#f1f5f9;color:#64748b}
.mcbg.cat{font-weight:600}
.mcbg.note-tag{background:#fef3c7;color:#92400e;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mccat{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500;line-height:1.5;white-space:nowrap;color:#fff}
.mcf{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding-top:7px;margin-top:4px}
.mcs{font-size:11px;display:flex;align-items:center;gap:4px;white-space:nowrap;flex-shrink:0}
.mcs.used{color:var(--success)}.mcs.unused{color:var(--warning)}
.mcaa{display:flex;gap:3px}
.mcsrc{font-size:11px;color:var(--text2);margin-bottom:3px;display:flex;align-items:center;gap:3px}
.mcsrc svg{width:12px;height:12px}

/* Context menu */
.ctx-menu{position:fixed;z-index:300;background:var(--card);border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.18);border:1px solid var(--border);overflow:hidden;min-width:140px;padding:4px}
.ctx-item{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:13px;cursor:pointer;border-radius:6px;transition:background .15s}
.ctx-item:hover{background:#f1f5f9}
.ctx-item svg{width:14px;height:14px;flex-shrink:0}
.ctx-item.danger{color:var(--danger)}
.ctx-item.danger:hover{background:var(--danger-bg)}
.ctx-sep{height:1px;background:var(--border);margin:4px 0}

/* Move mode */
.move-bar{position:sticky;top:0;z-index:50;background:var(--primary);color:#fff;padding:10px 16px;border-radius:8px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 2px 12px rgba(99,102,241,.3)}
.move-bar .mb-info{font-size:13px;display:flex;align-items:center;gap:6px}
.move-bar .mb-btns{display:flex;gap:8px}
.move-bar .mb-btn{padding:6px 16px;border-radius:6px;font-size:13px;font-weight:600;border:none;cursor:pointer}
.move-bar .mb-save{background:#fff;color:var(--primary)}
.move-bar .mb-cancel{background:rgba(255,255,255,.2);color:#fff}
.mc.dragging{opacity:.4}
.mc.drag-over{outline:2px dashed var(--primary);outline-offset:2px}
.mc-move-hint{cursor:grab !important}
.mc-move-hint:active{cursor:grabbing !important}



/* Modal */
.mo{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:20px}
.md{background:var(--card);border-radius:var(--radius);width:100%;max-width:600px;margin:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.mdh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);border-radius:var(--radius) var(--radius) 0 0;z-index:1}
.mdh h3{font-size:15px;font-weight:600}
.mdb{padding:18px;max-height:calc(100vh - 130px);overflow-y:auto}
.mdf{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--card);border-radius:0 0 var(--radius) var(--radius)}

.fg{margin-bottom:14px}
.fg label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.fg .rq{color:var(--danger)}
.fg input[type="text"],.fg input[type="number"],.fg input[type="date"],.fg select,.fg textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;transition:border-color .15s}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--primary)}
.fg textarea{resize:vertical;min-height:56px}
.fg .hint{font-size:12px;color:var(--text2);margin-top:3px}
.fr{display:flex;gap:10px}.fr .fg{flex:1}
.rg{display:flex;flex-wrap:wrap;gap:6px}
.cat-grid{display:flex;flex-wrap:wrap;gap:4px}.cat-grid label{display:inline-flex;align-items:center;gap:3px;padding:4px 10px;border:1px solid var(--border);border-radius:4px;font-size:13px;cursor:pointer;user-select:none;background:#fff;transition:all .15s}.cat-grid label:has(input:checked){border-color:var(--accent);background:#eef2ff;font-weight:600}.cat-grid input{margin:0}
.rg label,.chg label{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:400;cursor:pointer;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);transition:all .15s}
.rg label:has(input:checked),.chg label:has(input:checked){background:var(--primary-light);border-color:var(--primary);color:var(--primary-dark)}
.rg input,.chg input{margin:0}
.sg{margin-top:10px;padding:12px;background:#f8fafc;border-radius:var(--radius-sm);border:1px solid var(--border)}

/* Multi-image */
.imgs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.iu-box{width:100%;height:130px;border:2px dashed var(--border);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s;position:relative;overflow:hidden}
.iu-box:hover{border-color:var(--primary)}
.iu-box img{width:100%;height:100%;object-fit:cover}
.iu-box .iph{text-align:center;color:var(--text2);font-size:12px}
.iu-box .iph svg{width:28px;height:28px;margin-bottom:2px}
.iu-box .icl,.iua .icl{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.5);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:1;font-size:12px}
.iu-box.drag-over{border-color:var(--primary);background:var(--primary-light)}
.iu-box.drop-zone{cursor:pointer}

.iua{width:100%;height:150px;border:2px dashed var(--border);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s;position:relative;overflow:hidden}
.iua:hover{border-color:var(--primary)}
.iua img{width:100%;height:100%;object-fit:cover}
.iuph{text-align:center;color:var(--text2);font-size:13px}
.iuph svg{width:36px;height:36px;margin-bottom:4px}

/* Excel import */
.xi-drop{width:100%;min-height:120px;border:2px dashed var(--border);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s;text-align:center;flex-direction:column;gap:6px;padding:20px}
.xi-drop:hover{border-color:var(--primary)}
.xi-drop svg{width:40px;height:40px;color:var(--text2)}
.xi-preview{max-height:180px;overflow:auto;margin-top:12px;border:1px solid var(--border);border-radius:var(--radius-sm)}
.xi-preview table{width:100%;border-collapse:collapse;font-size:11px}
.xi-preview th{background:#f8fafc;padding:6px 8px;text-align:left;border-bottom:1px solid var(--border);position:sticky;top:0;font-weight:600}
.xi-preview td{padding:5px 8px;border-bottom:1px solid var(--border);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.xi-map{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.xi-map .fg{margin-bottom:0}
.xi-map .fg select{font-size:12px;padding:6px 8px}

/* Lightbox */
.lb{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.88);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;flex-direction:column;gap:10px}
.lb-bg{position:absolute;top:0;left:0;width:100%;height:100%;cursor:pointer;z-index:0}
.lb-img-wrap{position:relative;z-index:1;display:flex;align-items:center;justify-content:center}
.lb img.lb-main{max-width:92vw;max-height:85vh;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.4);transition:transform .15s ease-out;cursor:default;user-select:none;-webkit-user-drag:none}
.lb img.lb-main.zoomed{cursor:grab;transition:none}
.lb img.lb-main.zoomed.dragging{cursor:grabbing}
.lb .lc{position:absolute;top:16px;right:16px;color:#fff;cursor:pointer;z-index:2;background:rgba(0,0,0,.5);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.lb .lc svg{width:24px;height:24px}
.lb .lc:hover{background:rgba(255,255,255,.2)}
/* Lightbox minimap */
.lb-minimap{position:fixed;right:16px;bottom:16px;width:160px;height:120px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.25);border-radius:6px;overflow:hidden;z-index:10;cursor:crosshair}
.lb-minimap img{width:100%;height:100%;object-fit:contain;opacity:.7;pointer-events:none}
.lb-vport{position:absolute;border:2px solid #fff;background:rgba(255,255,255,.2);border-radius:2px;cursor:grab}
.lb-vport:active{cursor:grabbing}
.lb-tools{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:2;display:flex;gap:8px;background:rgba(0,0,0,.5);border-radius:20px;padding:4px 12px}
.lb-tool{color:#fff;cursor:pointer;font-size:12px;padding:4px 10px;border-radius:12px;transition:background .15s}
.lb-tool:hover{background:rgba(255,255,255,.2)}
.lb-thumbs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.lb-thumb{width:50px;height:50px;border-radius:6px;overflow:hidden;cursor:pointer;border:2px solid transparent;opacity:.6;transition:all .15s}
.lb-thumb:hover,.lb-thumb.active{border-color:#fff;opacity:1}
.lb-thumb img{width:100%;height:100%;object-fit:cover}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;z-index:400;box-shadow:0 4px 12px rgba(0,0,0,.2);max-width:90vw}

.cd{max-width:420px;text-align:center}
.cd .ci{width:44px;height:44px;margin:0 auto 10px;border-radius:50%;background:var(--danger-bg);display:flex;align-items:center;justify-content:center}
.cd .ci svg{width:22px;height:22px;color:var(--danger)}
.cd p{font-size:14px;margin-bottom:16px}
.cd .mdf{justify-content:center}

.es{text-align:center;padding:40px 20px;color:var(--text2)}
.es svg{width:56px;height:56px;margin-bottom:10px;opacity:.25}
.es p{font-size:14px;margin-bottom:10px}

.usage-limit-sub{padding:8px 10px;margin-top:6px;background:#fafafa;border-radius:var(--radius-sm);border:1px solid var(--border)}
.usage-limit-sub .fr .fg{margin-bottom:0}

.pay-rec-box{border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;background:#fafbfc}
.pay-rec-box .fg{margin-bottom:10px}
.pay-rec-box .fg:last-child{margin-bottom:0}

@media(max-width:768px){
  .app-header{padding:8px 12px}.app-header h1{font-size:15px}
  .header-actions .btn span{display:none}.header-actions .btn{padding:8px}
  .app-body{flex-direction:column;height:auto;min-height:calc(100vh - 52px)}
  .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border);max-height:220px}
  .sidebar-list{display:flex;gap:5px;overflow-x:auto;padding:6px 10px}
  .sidebar-group,.sidebar-item{flex-shrink:0;white-space:nowrap}
  .sidebar-item .sd{display:none!important}.sidebar-item .sgrip{display:none!important}
  .sidebar-group-header{font-size:11px}
  .sidebar-group-items{margin-left:4px;display:flex;gap:4px}
  .sidebar-group-items.collapsed{display:none}
  .sidebar-footer{padding:6px 8px;gap:3px}
  .main-content{padding:10px;overflow:visible}
  .ov-cards{grid-template-columns:repeat(2,1fr);gap:8px}
  .ovc{padding:12px}.ovv{font-size:18px}
  .stats-row{grid-template-columns:1fr}
  .mat-grid{grid-template-columns:1fr}
  .mat-fl{width:100%}.mat-fl input{width:100%}
  .md{max-width:100%}.fr{flex-direction:column}
  .rg{flex-direction:column;gap:4px}
  .xi-map{grid-template-columns:1fr}
  .imgs-grid{grid-template-columns:repeat(2,1fr)}
  .main-content{padding-bottom:env(safe-area-inset-bottom)}
}
/* Filter Modal */
.filter-modal{background:var(--card);border-radius:var(--radius);max-width:600px;width:95vw;max-height:85vh;display:flex;flex-direction:column;margin:0}
.filter-modal .fm-hd{padding:16px 20px 0;flex-shrink:0}
.filter-modal h3{font-size:16px;margin:0}
.filter-modal .fm-body{padding:16px 20px;overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:16px}
.filter-modal .fm-sec{}
.filter-modal .fm-sec h4{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.filter-modal .fm-chips{display:flex;flex-wrap:wrap;gap:6px}
.filter-modal .fm-chip{padding:5px 12px;border-radius:16px;font-size:12px;border:1px solid var(--border);cursor:pointer;transition:all .15s;background:var(--card);color:var(--text);user-select:none}
.filter-modal .fm-chip:hover{border-color:var(--primary);background:var(--primary-light)}
.filter-modal .fm-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.filter-modal .fm-ft{display:flex;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--border);justify-content:flex-end;flex-shrink:0}
.filter-modal .fm-count{font-size:12px;color:var(--text2);margin-left:auto;align-self:center}
</style>
</head>

    <button class="btn" onclick="document.getElementById('ji').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span>导入恢复</span></button>
    <button class="btn" onclick="handleXImportClick()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 13v-2h6v2"/><path d="M12 9v6"/></svg><span>Excel导入</span></button>

    <button class="btn btn-danger" onclick="confirmClearAll()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg><span>清空数据</span></button>

</header>
<input type="file" id="ji" accept=".json" style="display:none" onchange="importJSON(event)">

<div id="db" class="data-banner" style="display:none">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
  <span id="dbt"></span><span class="cls" onclick="document.getElementById('db').style.display='none'"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
</div>

<div class="app-body">
  <aside class="sidebar">

      <div class="scard"><h3 id="ch2title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>店铺消费排行</h3><div id="ch2"></div></div>

    <div class="mdb">

        <div class="imgs-grid" id="imgGrid">

            <div class="iph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><div>添加图片</div></div>

          <label><input type="radio" name="fot" value="shop" onchange="onOwnerType()"> 店铺</label>

          <label><input type="radio" name="fst" value="限时"> 限时</label>

      </div>

              <label><input type="radio" name="frsq" value="私转" checked> 私转</label>
            </div>
          </div>
          <div id="frSubNoQuit" style="display:none">
            <div class="rg">
              <label><input type="checkbox" name="frsnq" value="官掉" onchange="onFrNoQuit()"> 官掉</label>

<script>

const CCOL={'立绘':'#6366f1','卤蛋':'#f97316','加装':'#db2777','CG':'#8b5cf6','美工':'#f59e0b','Q版':'#22c55e','素材':'#64748b','特效':'#7c3aed','场景':'#0ea5e9','音乐':'#d946ef','黑科技':'#1e293b','其他':'#94a3b8'};

const I={ shop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v11a1 1 0 001 1h14a1 1 0 001-1V9"/><path d="M9 22V12h6v10"/></svg>',

  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>',
  grip:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="5" r="1.8"/><circle cx="15" cy="5" r="1.8"/><circle cx="9" cy="12" r="1.8"/><circle cx="15" cy="12" r="1.8"/><circle cx="9" cy="19" r="1.8"/><circle cx="15" cy="19" r="1.8"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 00-1.11-1.79l-1.78-.9A2 2 0 0115 10.76V6h1a2 2 0 000-4H8a2 2 0 000 4h1v4.76a2 2 0 01-1.11 1.79l-1.78.9A2 2 0 005 15.24V17z"/></svg>',
  chevronL:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>',
  chevronR:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>',
  folder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>',
  move:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>' };

// ---- State ----
// groups: { shop:[{name:'分组1',collapsed:false},...], person:[...] }
// sourceGroup: { 'shop_店名':'分组名', 'person_人名':'分组名' }
let S={ shops:[], persons:[], items:[], selType:'shop', selName:'all', editItem:null, imgData:[], payImgData:'', pinned:{}, groups:{shop:[],person:[]}, sourceGroup:{}, groupCollapsed:{shop:{},person:{}} };
// selectedGroup: when a group is selected (null=not on a group, string=group name, 'all'=ungrouped)
let selectedGroup='all';

function gref(type,name){return type+'_'+name}

function migrateOld(){
  try{
    const oldSrc=JSON.parse(localStorage.getItem(PREFIX+'sources')||'null');
    const oldItems=JSON.parse(localStorage.getItem(PREFIX+'items')||'null');
    if(!oldItems||oldItems.length===0) return false;
    if(!oldSrc||oldSrc.length===0) return false;
    if(localStorage.getItem(PREFIX+'shops')) return false;
    oldSrc.forEach(s=>{
      if(s.type==='creator') S.persons.push(s.name);
      else S.shops.push(s.name);
    });
    S.shops=[...new Set(S.shops)]; S.persons=[...new Set(S.persons)];
    oldItems.forEach(i=>{
      const src=oldSrc.find(s=>s.id===i.sourceId);
      const ot=src&&src.type==='creator'?'person':'shop';
      const on=src?src.name:'未知';
      let images=[];
      if(i.image) images=[i.image];
      S.items.push({
        id:i.id||gid(), ownerType:ot, ownerName:on, name:i.name||'', images,
        category:i.category||'', subCategory:i.subCategory||'', customSubCategory:i.customSubCategory||'',
        customCategory:i.customCategory||'', boundLihui:i.boundLihui||'',
        purchaseSource:i.purchaseSource||'', purchaseSub:i.purchasePlatform||'',
        sponsorId:'', isSponsored:false, sponsorCount:1, sponsoredDone:0, isTransfer:'否',
        tongjiaRule:i.tongjiaRule||'', tongjiaLimit:i.tongjiaLimit||'',
        tongjiaType:i.tongjiaType||'', tongjiaScope:i.tongjiaScope||'',
        transferRule:i.transferRule||'',
        artist:i.artist||'', price:i.price||0, purchaseDate:i.purchaseDate||'',
        isDoublePoints:false, countInShop:ot==='shop'?(i.countInTotal!==false):true,
        countInPerson:ot==='person'?(i.countInTotal!==false):true,
        usageLimitType:'limited', usageLimitSubtype:'total', usageTotal:1, usageLead:1, usageSupport:1, usageOtherNote:'',
        usedCount:i.usedCount||0, isUsed:i.isUsed||false,
        note:i.note||'', createdAt:i.createdAt||new Date().toISOString(),
        paymentImage:'', paymentNote:''
      });
    });
    sv(); return true;
  }catch(e){ return false; }
}

function migrateImages(){
  let changed=false;
  S.items.forEach(i=>{
    if(i.image && !i.images){ i.images=[i.image]; delete i.image; changed=true; }
    if(!i.images) i.images=[];
    if(i.paymentImage===undefined) i.paymentImage='';
    if(i.paymentNote===undefined) i.paymentNote='';
    if(i.countInPerson===undefined){ i.countInPerson=i.ownerType==='person'?(i.countInShop!==false):true; changed=true; }
  });
  if(changed) sv();
}

function gid(){return 'id'+Date.now()+'_'+Math.random().toString(36).substr(2,6)}

// ---- IndexedDB for items (large data with base64 images) ----
let idbDB=null;
function idbInit(){
  return new Promise((resolve)=>{
    if(idbDB){resolve(idbDB);return}
    try{
      const req=indexedDB.open('wb_wysc_db',1);
      req.onupgradeneeded=function(e){
        const db=e.target.result;
        if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      };
      req.onsuccess=function(e){idbDB=e.target.result;resolve(idbDB)};
      req.onerror=function(){resolve(null)};
    }catch(e){resolve(null)}
  });
}
function idbGet(key){
  return new Promise((resolve)=>{
    if(!idbDB){resolve(null);return}
    try{
      const tx=idbDB.transaction('kv','readonly');
      const req=tx.objectStore('kv').get(key);
      req.onsuccess=()=>resolve(req.result===undefined?null:req.result);
      req.onerror=()=>resolve(null);
    }catch(e){resolve(null)}
  });
}
function idbSet(key,val){
  if(!idbDB){
    // Not ready yet, try to init then save
    idbInit().then(()=>idbSet(key,val));
    return;
  }
  try{
    const tx=idbDB.transaction('kv','readwrite');
    tx.objectStore('kv').put(val,key);
    tx.onerror=()=>{console.warn('IDB save failed for',key)};
  }catch(e){console.warn('IDB exception',e)}
}

// Persistence — all data in IndexedDB (no localStorage size limit)
let _ldFromLS=false; // track if we migrated from localStorage
function ld(){
  try{
    // Try localStorage first for backward compat (will be empty after migration)
    S.shops=JSON.parse(localStorage.getItem(PREFIX+'shops')||'[]');
    S.persons=JSON.parse(localStorage.getItem(PREFIX+'persons')||'[]');
    S.items=JSON.parse(localStorage.getItem(PREFIX+'items')||'[]');
    const st=JSON.parse(localStorage.getItem(PREFIX+'state')||'{}');
    S.selType=st.selType||'shop'; S.selName=st.selName||'all';
    S.pinned=JSON.parse(localStorage.getItem(PREFIX+'pinned')||'{}');
    S.groups=JSON.parse(localStorage.getItem(PREFIX+'groups')||'{"shop":[],"person":[]}');
    S.sourceGroup=JSON.parse(localStorage.getItem(PREFIX+'sourceGroup')||'{}');
    S.groupCollapsed=JSON.parse(localStorage.getItem(PREFIX+'groupCollapsed')||'{"shop":{},"person":{}}');
    selectedGroup = st.selectedGroup !== undefined ? st.selectedGroup : 'all';
    S._filterCat=st.filterCat||'all'; S._filterUsed=st.filterUsed||'all';
    S._filterSort=st.filterSort||'time_desc'; S._filterQuery=st.filterQuery||'';
    if(st.S_filter){ S_filter=st.S_filter; if(!S_filter.status) S_filter.status=[]; }
    // If localStorage has data, we need to migrate to IDB
    if(S.shops.length||S.persons.length||S.items.length) _ldFromLS=true;
  }catch(e){ S.shops=[]; S.persons=[]; S.items=[]; S.pinned={}; S.groups={shop:[],person:[]}; S.sourceGroup={}; S.groupCollapsed={shop:{},person:{}}; }
}
function sv(){
  // Save everything to IndexedDB (no size limit)
  idbSet('shops',S.shops);
  idbSet('persons',S.persons);
  idbSet('items',S.items);
  idbSet('state',{selType:S.selType,selName:S.selName,selectedGroup,filterCat:S._filterCat||'all',filterUsed:S._filterUsed||'all',filterSort:S._filterSort||'time_desc',filterQuery:S._filterQuery||'',S_filter});
  idbSet('pinned',S.pinned);
  idbSet('groups',S.groups);
  idbSet('sourceGroup',S.sourceGroup);
  idbSet('groupCollapsed',S.groupCollapsed);
  // Also save small text data to localStorage as backup (best effort)
  try{
    localStorage.setItem(PREFIX+'state',JSON.stringify({selType:S.selType,selName:S.selName,selectedGroup,filterCat:S._filterCat||'all',filterUsed:S._filterUsed||'all',filterSort:S._filterSort||'time_desc',filterQuery:S._filterQuery||'',S_filter}));
    localStorage.setItem(PREFIX+'groups',JSON.stringify(S.groups));
    localStorage.setItem(PREFIX+'sourceGroup',JSON.stringify(S.sourceGroup));
    localStorage.setItem(PREFIX+'groupCollapsed',JSON.stringify(S.groupCollapsed));
  }catch(e){}
  // Clean up old localStorage items data after successful IDB save
  if(_ldFromLS){
    try{localStorage.removeItem(PREFIX+'items');localStorage.removeItem(PREFIX+'shops');localStorage.removeItem(PREFIX+'persons');localStorage.removeItem(PREFIX+'pinned');_ldFromLS=false}catch(e){}
  }
  return true;
}

function closeSourceModal(){
  document.getElementById('smo').style.display='none';
  document.getElementById('srcAddType').style.display='';
}
function submitSourceModal(){
  const rawVal=document.getElementById('smi').value.trim();
  if(!rawVal){st('请输入名称');return}
  if(SrcModalMode==='add'){
    const sat=document.querySelector('input[name="sat"]:checked')?.value;
    if(sat==='group'){
      // Add a group
      const glist=S.groups[S.selType];
      if(glist.some(g=>g.name===rawVal)){st('该分组已存在');return}
      glist.push({name:rawVal});
      sv(); closeSourceModal(); renderAll(); st('分组已添加');
    }else{
      // Add source(s) — support batch: split by comma, dunhao, semicolon, newline
      const names=rawVal.split(/[,，、;；\n\r]+/).map(s=>s.trim()).filter(s=>s);
      if(names.length===0){st('请输入名称');return}
      const list=S.selType==='shop'?S.shops:S.persons;
      const typeLabel=S.selType==='shop'?'店铺':'个人';
      let added=0,skipped=0;
      const inGroup=selectedGroup&&selectedGroup!=='all'&&S.groups[S.selType].some(g=>g.name===selectedGroup);
      names.forEach(n=>{
        if(list.includes(n)){skipped++;return}
        list.push(n);
        if(inGroup) S.sourceGroup[gref(S.selType,n)]=selectedGroup;
        added++;
      });
      sv(); closeSourceModal(); renderAll();
      if(added>0&&skipped>0) st(`已添加 ${added} 个${typeLabel}，${skipped} 个已存在跳过`);
      else if(added>0) st(`已添加 ${added} 个${typeLabel}`);
      else st('所有名称均已存在');
    }
  }else if(SrcModalMode==='renameGroup'){
    // Rename group
    const val=rawVal;
    if(val===SrcModalOldName){closeSourceModal();return}
    const glist=S.groups[S.selType];
    if(glist.some(g=>g.name===val)&&val!==SrcModalOldName){st('该分组已存在');return}
    const gi=glist.findIndex(g=>g.name===SrcModalOldName);
    if(gi>=0) glist[gi].name=val;
    Object.keys(S.sourceGroup).forEach(k=>{ if(S.sourceGroup[k]===SrcModalOldName) S.sourceGroup[k]=val; });
    if(selectedGroup===SrcModalOldName) selectedGroup=val;
    if(S.groupCollapsed[S.selType][SrcModalOldName]!==undefined){ S.groupCollapsed[S.selType][val]=S.groupCollapsed[S.selType][SrcModalOldName]; delete S.groupCollapsed[S.selType][SrcModalOldName]; }
    sv(); closeSourceModal(); renderAll(); st('分组已重命名');
  }else{
    // Rename source
    const val=rawVal;
    if(val===SrcModalOldName){closeSourceModal();return}
    const list=S.selType==='shop'?S.shops:S.persons;
    if(list.includes(val)&&val!==SrcModalOldName){st('该名称已存在');return}
    const idx=list.indexOf(SrcModalOldName);
    S.items.forEach(i=>{
      if(i.ownerType===S.selType&&i.ownerName===SrcModalOldName) i.ownerName=val;
      if(S.selType==='person'&&i.artist){
        const names=splitArtists(i.artist);
        const ai=names.indexOf(SrcModalOldName);
        if(ai>=0){names[ai]=val;i.artist=names.join('，')}
      }
    });
    if(idx>=0) list[idx]=val;
    if(S.selName===SrcModalOldName) S.selName=val;
    // Update sourceGroup
    const ok=gref(S.selType,SrcModalOldName),nk=gref(S.selType,val);
    if(S.sourceGroup[ok]){S.sourceGroup[nk]=S.sourceGroup[ok];delete S.sourceGroup[ok]}
    const opk=S.selType+'_'+SrcModalOldName,npk=S.selType+'_'+val;
    if(S.pinned[opk]){S.pinned[npk]=true;delete S.pinned[opk]}
    sv(); closeSourceModal(); renderAll(); st('已修改');
  }
}

function deleteSidebarSource(name){

// ---- Sidebar drag reorder ----
let dragSrc=null, dragIdx=-1;
let multiSelectSources=new Set();
function selectSource(e,name){
  if(e&&(e.ctrlKey||e.metaKey)){
    if(multiSelectSources.has(name)) multiSelectSources.delete(name);
    else multiSelectSources.add(name);
    // Toggle class directly instead of rebuilding entire sidebar DOM
    if(e.currentTarget) e.currentTarget.classList.toggle('multiselect',multiSelectSources.has(name));
    return;
  }
  // Clear any previous multi-select
  if(multiSelectSources.size>0){
    multiSelectSources.clear();
    renderSidebar();
  }
  S.selName=name; selectedGroup=null;
  sv(); renderSidebar(); renderOV(); renderMaterials(); renderDonut(); renderBars();
}
function sdragStart(e,idx,name){
  dragSrc=name; dragIdx=idx;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',name);
  // If dragging a multi-selected item, show count in drag image
  if(multiSelectSources.size>1&&multiSelectSources.has(name)){
    try{
      const ghost=document.createElement('div');
      ghost.style.cssText='position:absolute;top:-9999px;left:-9999px;background:var(--primary);color:#fff;padding:6px 14px;border-radius:8px;font-size:13px;font-family:sans-serif;white-space:nowrap';
      ghost.textContent=`移动 ${multiSelectSources.size} 个来源`;
      document.body.appendChild(ghost);
      e.dataTransfer.setDragImage(ghost,0,0);
      setTimeout(()=>document.body.removeChild(ghost),0);
    }catch(err){}
  }
}
function sdragOver(e,idx,name){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  if(!dragSrc||dragSrc===name) return;
  e.currentTarget.classList.add('drag-over');
}
function sdragLeave(e){ e.currentTarget.classList.remove('drag-over'); }
function sdragDrop(e,idx,name){
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
  if(!dragSrc||dragSrc===name) return;
  const list=getSidebarList();
  const srcIdx=list.indexOf(dragSrc);
  if(srcIdx<0) return;
  // Remove source first
  const [moved]=list.splice(srcIdx,1);
  // Find target after removal (index may have shifted)
  let targetIdx=list.indexOf(name);
  if(targetIdx<0) targetIdx=idx>srcIdx?idx-1:idx;
  list.splice(targetIdx,0,moved);
  sv(); renderSidebar();
}
function sdragEnd(e){
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.sidebar-item.drag-over,.sidebar-group-header.drag-over,.sidebar-group-header.drag-over-src,.sidebar-section-label.drag-over').forEach(el=>{el.classList.remove('drag-over');el.classList.remove('drag-over-src')});
  dragSrc=null; dragIdx=-1;
}

// ---- Group drag reorder ----
let gDragSrc=null, gDragIdx=-1;
function gdragStart(e,idx,name){
  gDragSrc=name; gDragIdx=idx;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',name);
}
function gdragOver(e,idx,name){
  e.preventDefault();
  if(dragSrc){e.currentTarget.classList.add('drag-over-src');return}
  if(!gDragSrc||gDragSrc===name) return;
  e.currentTarget.classList.add('drag-over');
}
function gdragLeave(e){ e.currentTarget.classList.remove('drag-over');e.currentTarget.classList.remove('drag-over-src'); }
function gdragDrop(e,idx,name){
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');e.currentTarget.classList.remove('drag-over-src');
  // Source drop: move source(s) to this group
  if(dragSrc){
    const sources=(multiSelectSources.size>0&&multiSelectSources.has(dragSrc))?[...multiSelectSources]:[dragSrc];
    sources.forEach(src=>{S.sourceGroup[gref(S.selType,src)]=name});
    multiSelectSources.clear();
    sv();renderSidebar();renderAll();
    st(`已将 ${sources.length} 个来源移入「${name}」`);
    return;
  }
  // Group reorder
  if(!gDragSrc||gDragSrc===name) return;
  const glist=S.groups[S.selType];
  const srcIdx=glist.findIndex(g=>g.name===gDragSrc);
  if(srcIdx<0) return;
  const movedItem=glist.splice(srcIdx,1)[0];
  const targetIdx=glist.findIndex(g=>g.name===name);
  glist.splice(targetIdx,0,movedItem);
  sv(); renderSidebar();
}
function gdragEnd(e){
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.sidebar-group-header.drag-over,.sidebar-group-header.drag-over-src').forEach(el=>{el.classList.remove('drag-over');el.classList.remove('drag-over-src')});
  gDragSrc=null; gDragIdx=-1;
}

function ungroupedDragLeave(e){ e.currentTarget.classList.remove('drag-over'); }
function ungroupedDrop(e){

}

function hideGCtxMenu(){ document.getElementById('gCtxMenu').style.display='none'; gCtxTarget=null; }
function gCtxRename(){
  if(!gCtxTarget){hideGCtxMenu();return}
  const t=gCtxTarget; hideGCtxMenu();

}
function gCtxDeleteOnly(){
  if(!gCtxTarget){hideGCtxMenu();return}
  const t=gCtxTarget; hideGCtxMenu();
  confirm(`删除分组「${t}」（组内来源保留为未分类），确定？`,()=>{
    const glist=S.groups[S.selType];
    const gi=glist.findIndex(g=>g.name===t);
    if(gi>=0) glist.splice(gi,1);
    Object.keys(S.sourceGroup).forEach(k=>{ if(S.sourceGroup[k]===t) delete S.sourceGroup[k]; });
    if(selectedGroup===t) selectedGroup='all';
    if(S.groupCollapsed[S.selType][t]!==undefined) delete S.groupCollapsed[S.selType][t];
    sv(); renderAll(); st('已删除分组');
  });
}
function gCtxDeleteWithContents(){
  if(!gCtxTarget){hideGCtxMenu();return}
  const t=gCtxTarget; hideGCtxMenu();
  const sources=getSourcesInGroup(t);
  const n=S.items.filter(i=>i.ownerType===S.selType&&sources.includes(i.ownerName)).length;
  confirm(`删除分组「${t}」及组内 ${n} 条素材，确定？`,()=>{
    const glist=S.groups[S.selType];
    const gi=glist.findIndex(g=>g.name===t);
    if(gi>=0) glist.splice(gi,1);
    Object.keys(S.sourceGroup).forEach(k=>{ if(S.sourceGroup[k]===t) delete S.sourceGroup[k]; });
    S.items=S.items.filter(i=>!(i.ownerType===S.selType&&sources.includes(i.ownerName)));
    if(selectedGroup===t) selectedGroup='all';
    if(S.groupCollapsed[S.selType][t]!==undefined) delete S.groupCollapsed[S.selType][t];
    sv(); renderAll(); st('已删除分组及内容');
  });
}

function ctxMoveToGroup(){

function countItemsForSource(sourceName){
  if(S.selType==='person'){
    return S.items.filter(i=>
      (i.ownerType==='person'&&i.ownerName===sourceName)||
      (i.ownerType==='shop'&&splitArtists(i.artist).includes(sourceName))
    ).length;
  }
  return S.items.filter(i=>i.ownerType===S.selType&&i.ownerName===sourceName).length;
}

function renderDonut(){
  const el=document.getElementById('ch1'),cats={};
  let items=getItemsForView();
  items.forEach(i=>{getCats(i).forEach(c=>{cats[c]=(cats[c]||0)+1});if(getCats(i).length===0)cats['其他']=(cats['其他']||0)+1});
  const data=Object.entries(cats).map(([k,v])=>({label:k,value:v,color:CCOL[k]||'#94a3b8'}));
  if(data.length===0){el.innerHTML='<div class="emp">暂无数据</div>';return}
  data.sort((a,b)=>b.value-a.value);
  const total=data.reduce((s,d)=>s+d.value,0),r=60,cx=80,cy=80,circ=2*Math.PI*r;
  let off=0;
  const segs=data.map(d=>{const len=(d.value/total)*circ;const s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="22" stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`;off+=len;return s}).join('');
  const leg=data.map(d=>`<div class="litem" onclick="S_filter.category=['${d.label}'];applyFilter()"><span class="ldot" style="background:${d.color}"></span><span class="llb">${eh(d.label)}</span><span class="lvl">${d.value}</span></div>`).join('');
  el.innerHTML=`<div class="chart-wrap"><svg width="160" height="160" viewBox="0 0 160 160">${segs}<text x="${cx}" y="${cy-5}" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">${total}</text><text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="11" fill="#64748b">素材总数</text></svg><div class="legend">${leg}</div></div>`;
}

function renderBars(){
  const el=document.getElementById('ch2'),titleEl=document.getElementById('ch2title');
  const srcs={};
  let items=getItemsForView(); // Respect sidebar view filter

  if(S.selType==='shop'){
    items=items.filter(i=>i.countInShop!==false);
    titleEl.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>店铺消费排行';
    items.forEach(i=>{const dbl=i.isDoublePoints?2:1;srcs[i.ownerName]=(srcs[i.ownerName]||0)+getEffPrice(i)*dbl});
  }else{
    // Person tab: person-owned items + shop items with artist in S.persons
    items=items.filter(i=>i.countInPerson!==false);
    titleEl.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>个人消费排行';
    items.forEach(i=>{
      const dbl=i.isDoublePoints?2:1;
      const val=getEffPrice(i)*dbl;
      if(i.ownerType==='shop'){
        // Split artist names by comma/顿号, each artist gets full price
        const names=splitArtists(i.artist);
        if(names.length===0){srcs['未知']=(srcs['未知']||0)+val}
        else names.forEach(n=>{srcs[n]=(srcs[n]||0)+val});
      }else{
        const names=splitArtists(i.ownerName);
        if(names.length===0){srcs['未知']=(srcs['未知']||0)+val}
        else names.forEach(n=>{srcs[n]=(srcs[n]||0)+val});
      }
    });
  }
  const data=Object.entries(srcs).map(([k,v])=>({label:k,value:v}));data.sort((a,b)=>b.value-a.value);
  if(data.length===0){el.innerHTML='<div class="emp">暂无消费数据</div>';return}
  const max=Math.max(...data.map(d=>d.value),1);
  el.innerHTML=`<div class="bars">${data.map(d=>{const w=(d.value/max)*100;return `<div class="brow"><span class="blb">${eh(d.label)}</span><div class="btk"><div class="bfi" style="width:${w}%">¥${d.value.toFixed(2)}</div></div></div>`}).join('')}</div>`;
}

function getItemsForView(){
  let items=S.items.slice();
  if(selectedGroup!==null&&selectedGroup!=='all'){
    // A specific group is selected
    const sources=getSourcesInGroup(selectedGroup);
    if(S.selType==='shop'){
      items=items.filter(i=>i.ownerType==='shop'&&sources.includes(i.ownerName));
    }else{
      // Person group: person-owned items in group + shop items with artist in group
      items=items.filter(i=>
        (i.ownerType==='person'&&sources.includes(i.ownerName))||
        (i.ownerType==='shop'&&i.artist&&splitArtists(i.artist).some(n=>sources.includes(n)))
      );
    }
  }else if(selectedGroup==='all'){
    // Ungrouped
    const ungrouped=getUngroupedSources();
    if(S.selType==='shop'){
      items=items.filter(i=>i.ownerType==='shop'&&ungrouped.includes(i.ownerName));
    }else{
      // Person ungrouped: directly-owned ungrouped + any artist matches
      items=items.filter(i=>
        (i.ownerType==='person'&&ungrouped.includes(i.ownerName))||
        (i.ownerType==='shop'&&i.artist&&splitArtists(i.artist).some(n=>ungrouped.includes(n)))
      );
    }
  }else{
    // A specific source is selected
    if(S.selType==='shop'){
      items=items.filter(i=>i.ownerType==='shop'&&i.ownerName===S.selName);
    }else{
      items=items.filter(i=>
        (i.ownerType==='shop'&&splitArtists(i.artist).includes(S.selName))||
        (i.ownerType==='person'&&i.ownerName===S.selName)
      );
    }
  }
  return items;
}

// ---- Filter Modal (Advanced Filter) ----
let S_filter={artist:[],saleType:[],category:[],source:[],tongjia:[],status:[]};
function openFilterModal(){
  const items=getItemsForView();
  // Collect all unique values
  const artists=new Set(), saleTypes=new Set(), cats=new Set(), sources=new Set(), tongjias=new Set();
  items.forEach(i=>{
    if(i.artist) splitArtists(i.artist).forEach(a=>artists.add(a));
    if(i.saleType) saleTypes.add(i.saleType);
    getCats(i).forEach(c=>cats.add(c));
    const psd=getPSD(i);
    if(psd){
      // Split by the separator for multi-part labels (赞助购入 has "余N待赞助")
      psd.split('\x00').forEach(p=>{
        if(p&&!p.startsWith('余')) sources.add(p);
      });
    }
    const tj=getTongjiaRule(i);
    if(tj) tongjias.add(tj);
  });
  // Dynamic status options
  const statusOptions=[];
  const hasUsed=items.some(i=>i.isUsed);
  const hasUnused=items.some(i=>!i.isUsed);
  const hasSponsor=items.some(i=>{const psd=getPSD(i);return psd&&/余\d+待赞助/.test(psd)});
  const hasPendingSponsor=items.some(i=>{const psd=getPSD(i);return psd&&/余\d+待赞助/.test(psd)});
  if(hasPendingSponsor) statusOptions.push({val:'pending_sponsor',label:'待赞助'});
  if(hasUnused&&hasUsed){statusOptions.push({val:'unused',label:'未使用'});statusOptions.push({val:'used',label:'已使用'});}
  const statusSec=document.getElementById('fmStatusSec');
  if(statusOptions.length===0){statusSec.style.display='none'}
  else{statusSec.style.display='';renderStatusChips(statusOptions)}
  // Render chips
  renderFilterChips('fmArtist',[...artists].sort((a,b)=>a.localeCompare(b,'zh')),'artist');
  renderFilterChips('fmSaleType',[...saleTypes].sort((a,b)=>a.localeCompare(b,'zh')),'saleType');
  renderFilterChips('fmCategory',[...cats].sort((a,b)=>a.localeCompare(b,'zh')),'category');
  renderFilterChips('fmSource',[...sources].sort((a,b)=>a.localeCompare(b,'zh')),'source');
  renderFilterChips('fmTongjia',[...tongjias].sort((a,b)=>a.localeCompare(b,'zh')),'tongjia');
  updateFilterCount();
  document.getElementById('fmo').style.display='flex';
}
function renderFilterChips(containerId,values,dim){
  const el=document.getElementById(containerId);
  if(values.length===0){el.innerHTML='<span style="font-size:12px;color:var(--text2)">无</span>';return}
  el.innerHTML=values.map(v=>{
    const active=S_filter[dim].includes(v)?' active':'';
    return `<span class="fm-chip${active}" onclick="toggleFilterChip(event,'${dim}','${eh(v)}')">${eh(v)}</span>`;
  }).join('');
}
function renderStatusChips(options){
  const el=document.getElementById('fmStatus');
  el.innerHTML=options.map(o=>{
    const active=S_filter.status.includes(o.val)?' active':'';
    return `<span class="fm-chip${active}" onclick="toggleFilterChip(event,'status','${o.val}')">${o.label}</span>`;
  }).join('');
}
function toggleFilterChip(e,dim,val){
  e.currentTarget.classList.toggle('active');
  const arr=S_filter[dim];
  const idx=arr.indexOf(val);
  if(idx>=0) arr.splice(idx,1); else arr.push(val);
  updateFilterCount();
}
function updateFilterCount(){
  const total=S_filter.artist.length+S_filter.saleType.length+S_filter.category.length+S_filter.source.length+S_filter.tongjia.length+S_filter.status.length;

}

}
function closeFilterModal(){
  document.getElementById('fmo').style.display='none';
}
function hasActiveFilter(){
  return S_filter.artist.length>0||S_filter.saleType.length>0||S_filter.category.length>0||S_filter.source.length>0||S_filter.tongjia.length>0||S_filter.status.length>0;
}
function applyFilterToItems(items){
  if(!hasActiveFilter()) return items;
  return items.filter(i=>{
    if(S_filter.artist.length>0){
      const iArtists=splitArtists(i.artist||'');
      if(!iArtists.some(a=>S_filter.artist.includes(a))) return false;
    }
    if(S_filter.saleType.length>0&&!S_filter.saleType.includes(i.saleType||'')) return false;
    if(S_filter.category.length>0){
      const iCats=getCats(i);
      if(!iCats.some(c=>S_filter.category.includes(c))) return false;
    }
    if(S_filter.source.length>0){
      const psd=getPSD(i);
      const srcs=psd?psd.split('\x00').filter(p=>p&&!p.startsWith('余')):[];
      if(!srcs.some(s=>S_filter.source.includes(s))) return false;
    }
    if(S_filter.tongjia.length>0){
      const tj=getTongjiaRule(i);
      if(!S_filter.tongjia.includes(tj)) return false;
    }
    if(S_filter.status.length>0){
      let matchStatus=false;
      if(S_filter.status.includes('pending_sponsor')){
        const psd=getPSD(i);if(psd&&/余\d+待赞助/.test(psd)) matchStatus=true;
      }
      if(S_filter.status.includes('unused')&&!i.isUsed) matchStatus=true;
      if(S_filter.status.includes('used')&&i.isUsed) matchStatus=true;
      if(!matchStatus) return false;
    }
    return true;
  });
}
function getTongjiaRule(i){
  if(!i.tongjiaRule) return '';
  return i.tongjiaRule;
}

  }
}

function autoExtractPersons(){
  const artistCount={};
  S.items.filter(i=>i.ownerType==='shop'&&i.artist).forEach(i=>{
    splitArtists(i.artist).forEach(n=>{artistCount[n]=(artistCount[n]||0)+1});
  });
  Object.entries(artistCount).forEach(([artist,cnt])=>{
    if(cnt>=3 && !S.persons.includes(artist)){
      S.persons.push(artist);
    }
  });
  S.items.filter(i=>i.ownerType==='person').forEach(i=>{
    if(i.ownerName&&!S.persons.includes(i.ownerName)) S.persons.push(i.ownerName);
    splitArtists(i.artist).forEach(n=>{if(n&&!S.persons.includes(n)) S.persons.push(n)});
  });
}

  const tRule=document.querySelector('input[name="fr"]:checked')?.value||'';

    artist:document.getElementById('fa').value.trim(),
    price:parseFloat(document.getElementById('fp').value)||0,
    purchaseDate:document.getElementById('fpd').value,
    isDoublePoints:document.getElementById('fdp').checked,
    countInShop:ot==='shop'?(isSponsored?false:document.getElementById('fct').checked):(S.editItem?S.editItem.countInShop!==false:true),
    countInPerson:ot==='person'?(isSponsored?false:document.getElementById('fct').checked):(S.editItem?S.editItem.countInPerson!==false:true),
    usageLimitType:ult,usageLimitSubtype:ulst,

    usageSupport:parseInt(document.getElementById('fulSupp').value)||1,
    usageOtherNote:ulst==='other'?document.getElementById('fulOther').value.trim():'',
    usedCount:ult==='unlimited'?0:(parseInt(document.getElementById('fuc').value)||0),

  };
  if(S.editItem){const idx=S.items.findIndex(i=>i.id===S.editItem.id);if(idx>=0)S.items[idx]=item}
  else S.items.push(item);
  if(ot==='person'&&item.artist) splitArtists(item.artist).forEach(n=>{if(n&&!S.persons.includes(n)) S.persons.push(n)});
  // Save to IndexedDB (large capacity, no practical limit)

  closeItemModal();renderAll();st(S.editItem?'素材已更新':'素材已添加');
}

  moveMode=false;moveOrder=[];moveDragId=null;

}
function saveMoveMode(){
  // Read current DOM order
  const cards=document.querySelectorAll('#mg .mat-grid .mc');
  if(cards.length===0){cancelMoveMode();return}
  const newOrder=Array.from(cards).map(c=>c.dataset.id).filter(Boolean);
  const displaySet=new Set(newOrder);
  const itemMap={};S.items.forEach(i=>itemMap[i.id]=i);
  const queue=[...newOrder];
  S.items=S.items.map(i=>displaySet.has(i.id)?itemMap[queue.shift()]:i);
  sv();moveMode=false;moveOrder=[];moveDragId=null;renderAll();st('顺序已保存');
}
function onMoveDragStart(e,id){moveDragId=id;e.dataTransfer.effectAllowed='move';e.target.classList.add('dragging')}
function onMoveDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';const c=e.currentTarget;c.classList.add('drag-over')}
function onMoveDragLeave(e){e.currentTarget.classList.remove('drag-over')}
function onMoveDrop(e,targetId){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if(!moveDragId||moveDragId===targetId) return;
  // Reorder moveOrder array
  const fromIdx=moveOrder.indexOf(moveDragId);
  const toIdx=moveOrder.indexOf(targetId);
  if(fromIdx<0||toIdx<0) return;
  moveOrder.splice(fromIdx,1);
  moveOrder.splice(toIdx,0,moveDragId);
  moveDragId=null;
  renderMaterials();
}
function onMoveDragEnd(e){e.target.classList.remove('dragging');document.querySelectorAll('.mc.drag-over').forEach(c=>c.classList.remove('drag-over'))}

function onPS(){
  const v=document.querySelector('input[name="ps"]:checked')?.value;
  document.getElementById('psp').style.display=v==='购入'?'':'none';
  document.getElementById('psz').style.display=v==='赞助'?'':'none';

  if(v==='接转'){
    const fr=document.querySelector('input[name="fr"][value="不可转"]');if(fr)fr.checked=true;
    onTransferRule();
  }
  if(v!=='购入'){document.querySelectorAll('input[name="pp"]').forEach(r=>r.checked=false)}
  if(v!=='赞助'){document.querySelectorAll('input[name="pz"]').forEach(r=>r.checked=false)}
  onPZ(); // refresh sub-field visibility
}
function onPZ(){
  const v=document.querySelector('input[name="pz"]:checked')?.value;
  // pz=赞助: show sponsor count + sponsored done; hide sponsor ID
  // pz=被赞助: show sponsor ID; hide sponsor count
  const wrap=document.getElementById('fspcWrap');
  const spId=document.getElementById('fsponsor');
  if(v==='赞助'){
    wrap.style.display='flex';spId.style.display='none';
    if(!document.getElementById('fsponcount').value||document.getElementById('fsponcount').value==='1') document.getElementById('fsponcount').value='1';
    if(!document.getElementById('fsponcount2').value) document.getElementById('fsponcount2').value='0';
  }else if(v==='被赞助'){
    wrap.style.display='none';spId.style.display='';
    document.getElementById('fct').checked=false;
  }else{
    wrap.style.display='none';spId.style.display='none';
  }
  if(v!=='赞助'){document.getElementById('fsponcount').value='1';document.getElementById('fsponcount2').value='0'}
}
function onTransfer(){
  const v=document.querySelector('input[name="ftransfer"]:checked')?.value;
  const isTransfer=v==='是';
  document.getElementById('ftransferid').style.display=isTransfer?'':'none';
  // "使用次数规则" block: hidden when transferred
  document.getElementById('fulg').style.display=isTransfer?'none':'';
  // "已使用次数" + sub-options: depend on both transfer and usage limit
  onUsageLimit();
  if(isTransfer){
    // Default uncheck "计入消费" → shows "已转" tag (not counted)
    document.getElementById('fct').checked=false;
  }else{
    // Restore default checked state
    document.getElementById('fct').checked=true;
  }
}
function onTransferRule(){
  const v=document.querySelector('input[name="fr"]:checked')?.value||'';
  const sub=document.getElementById('frSub');
  const quit=document.getElementById('frSubQuit');
  const noquit=document.getElementById('frSubNoQuit');
  const ftg=document.getElementById('ftg');
  if(v==='退圈可转'){
    sub.style.display='';quit.style.display='';noquit.style.display='none';
    ftg.style.display='';
    const ps=document.querySelector('input[name="frsq"][value="私转"]');
    if(ps&&!document.querySelector('input[name="frsq"]:checked'))ps.checked=true;
  }else if(v==='不退圈可转'){
    sub.style.display='';quit.style.display='none';noquit.style.display='';onFrNoQuit();
    ftg.style.display='';
  }else{
    sub.style.display='none';quit.style.display='none';noquit.style.display='none';
    ftg.style.display='none';
    // Reset transfer radio to 否 when hiding
    const nr=document.querySelector('input[name="ftransfer"][value="否"]');
    if(nr)nr.checked=true;
    document.getElementById('ftransferid').style.display='none';
  }
}
function onFrNoQuit(){
  document.getElementById('frvipnote').style.display=document.querySelector('input[name="frsnq"][value="VIP转让"]').checked?'':'none';
  document.getElementById('frothernote').style.display=document.querySelector('input[name="frsnq"][value="其他"]').checked?'':'none';
}
// Auto-fill transfer rule + usage limit rule from existing items with same artist/source
function autoFillRules(){
  const artist=document.getElementById('fa').value.trim();
  if(!artist) return;
  // Find the most recent item with the same artist (not the one being edited)
  const match=S.items.filter(i=>splitArtists(i.artist).includes(artist)&&(!S.editItem||i.id!==S.editItem.id));
  if(match.length===0) return;
  const ref=match[match.length-1]; // most recent
  let filled=[];
  // Transfer rule — skip if user already selected one
  const hasTR=document.querySelector('input[name="fr"]:checked');
  if(!hasTR&&ref.transferRule){
    const fr=document.querySelector(`input[name="fr"][value="${ref.transferRule}"]`);
    if(fr){fr.checked=true;onTransferRule();filled.push('转让规则')}
    if(ref.transferSub){
      if(ref.transferRule==='退圈可转'){
        const r=document.querySelector(`input[name="frsq"][value="${ref.transferSub}"]`);
        if(r)r.checked=true;
      }else if(ref.transferRule==='不退圈可转'){
        ref.transferSub.split(',').forEach(v=>{
          const c=document.querySelector(`input[name="frsnq"][value="${v.trim()}"]`);
          if(c)c.checked=true;
        });
        if(ref.frVipNote){document.getElementById('frvipnote').value=ref.frVipNote}
        if(ref.frOtherNote){document.getElementById('frothernote').value=ref.frOtherNote}
        onFrNoQuit();
      }
    }
  }
  // Usage limit — skip if user already selected one
  const hasUL=document.querySelector('input[name="ful"]:checked');
  if(!hasUL&&ref.usageLimitType){
    const ulr=document.querySelector(`input[name="ful"][value="${ref.usageLimitType}"]`);
    if(ulr){ulr.checked=true;onUsageLimit();filled.push('使用次数规则')}
    if(ref.usageLimitSubtype){
      const ulsr=document.querySelector(`input[name="fulst"][value="${ref.usageLimitSubtype}"]`);
      if(ulsr){ulsr.checked=true;onUsageLimitSub()}
    }
    if(ref.usageTotal)document.getElementById('fult').value=ref.usageTotal;
    if(ref.usageLead){
      document.getElementById('fulLead').value=ref.usageLead;
      document.getElementById('fulLead2').value=ref.usageLead;
    }
    if(ref.usageSupport)document.getElementById('fulSupp').value=ref.usageSupport;
    if(ref.usageOtherNote)document.getElementById('fulOther').value=ref.usageOtherNote;
  }
  if(filled.length>0) st(`已从「${artist}」的已有记录自动填充：${filled.join('、')}`);
}
// Render multi-cat checkbox grid
function renderCatGrid(checkedArr){

    `<label><input type="checkbox" name="fck" value="${c}" onchange="onCatCheck()"${set.has(c)?' checked':''}> ${c}</label>`

// Called when any major category checkbox changes
function onCatCheck(){
  const cats=getCheckedCats();
  const sub=document.getElementById('catsub'),fcc=document.getElementById('fcc'),
        fccs=document.getElementById('fccs'),fbl=document.getElementById('fbl'),
        tjg=document.getElementById('tjg'),jzg=document.getElementById('jzg');
  sub.style.display='none';fcc.style.display='none';fccs.style.display='none';
  fbl.style.display='none';tjg.style.display='none';jzg.style.display='none';
  // Build sub-category checkboxes: collect all subs from all checked main cats
  const allSubs=new Set();
  cats.forEach(c=>{ if(SUBS[c]) SUBS[c].forEach(s=>allSubs.add(s)); });
  const subArr=[...allSubs];
  if(subArr.length>0){
    sub.style.display='';
    const grid=document.getElementById('fcsubGrid');
    grid.innerHTML=subArr.map(s=>`<label><input type="checkbox" name="fcsk" value="${s}" onchange="onCatSubCheck()"> ${s}</label>`).join('');
  }
  if(cats.includes('其他')) fcc.style.display='';
  if(cats.includes('加装')){ jzg.style.display=''; const ulc=document.querySelector('input[name="jzr"][value="无限制"]'); if(ulc&&!document.querySelector('input[name="jzr"]:checked')){ulc.checked=true;onJz();} }
  if(cats.includes('其他')) fcc.style.display='';
  if(cats.includes('加装')){ jzg.style.display=''; const ulc=document.querySelector('input[name="jzr"][value="无限制"]'); if(ulc&&!document.querySelector('input[name="jzr"]:checked')){ulc.checked=true;onJz();} }
  if(cats.includes('立绘')||cats.includes('卤蛋')){
    tjg.style.display='';
    if(cats.includes('卤蛋')){
      const tjr=document.querySelector('input[name="tj"][value="可穿通加"]'); if(tjr&&!document.querySelector('input[name="tj"]:checked')) tjr.checked=true;
      onTj();
      const tlr=document.querySelector('input[name="tjl"][value="unlimited"]'); if(tlr&&!document.querySelector('input[name="tjl"]:checked')) tlr.checked=true;
      onTjl();
    }
  }
  // Update artist label: use label prefix based on first category with a mapping
  const first=cats[0]||'';
  const sourceCats=['美工','特效','音乐','黑科技'];
  document.querySelector('#fa').previousElementSibling.textContent=sourceCats.includes(first)?'画师/美工/来源名字':'画师/美工名字';
  // Default usage limit: 立绘/卤蛋 → limited, others → unlimited
  if(cats.length>0){
    const isLimited=cats.includes('立绘')||cats.includes('卤蛋');
    const defaultUL=isLimited?'limited':'unlimited';
    const ulr=document.querySelector(`input[name="ful"][value="${defaultUL}"]`);
    if(ulr) ulr.checked=true;
    onUsageLimit();
  }
}
function onCatSubCheck(){
  const checked=Array.from(document.querySelectorAll('input[name="fcsk"]:checked')).map(c=>c.value);
  document.getElementById('fccs').style.display=checked.includes('其他')?'':'none';
  const cats=getCheckedCats();
  document.getElementById('fbl').style.display=(cats.includes('Q版')&&checked.includes('绑定Q'))?'':'none';
}
function getCheckedSubs(){return Array.from(document.querySelectorAll('input[name="fcsk"]:checked')).map(c=>c.value)}
function onCatSub(){} // keep as no-op for backward compat
function onTj(){
  const v=document.querySelector('input[name="tj"]:checked')?.value;
  document.getElementById('tjs').style.display=v==='可穿通加'?'':'none';
  if(v==='可穿通加'){
    const ul=document.querySelector('input[name="tjl"][value="unlimited"]');
    if(ul){ul.checked=true;onTjl()}
  }else{
    document.querySelectorAll('input[name="tjl"]').forEach(r=>r.checked=false);onTjl()

function onTjl(){
  const v=document.querySelector('input[name="tjl"]:checked')?.value;
  document.getElementById('tlg').style.display=v==='limited'?'':'none';
  document.getElementById('tuh').style.display=v==='unlimited'?'':'none';
  if(v!=='limited'){document.querySelectorAll('input[name="tjt"]').forEach(r=>r.checked=false);document.querySelectorAll('input[name="tjs"]').forEach(r=>r.checked=false)}

function onJz(){
  const checks=Array.from(document.querySelectorAll('input[name="jzr"]'));
  const ul=checks.find(c=>c.value==='无限制');
  const others=checks.filter(c=>c.value!=='无限制');
  const anyOther=others.some(c=>c.checked);
  if(ul.checked&&anyOther){ul.checked=false}   // user picked specific, uncheck 无限制
  else if(ul.checked){others.forEach(c=>c.checked=false)}  // 无限制 only, clear others
  document.getElementById('fjzshop').style.display=checks.find(c=>c.value==='店专属').checked?'':'none';
  document.getElementById('fjzlihui').style.display=checks.find(c=>c.value==='绑定立绘').checked?'':'none';
  document.getElementById('fjzcustom').style.display=checks.find(c=>c.value==='自定义').checked?'':'none';
}
function onUsageLimit(){
  const v=document.querySelector('input[name="ful"]:checked')?.value;
  const isTransfer=document.querySelector('input[name="ftransfer"]:checked')?.value==='是';
  const showSub=(v==='limited'&&!isTransfer);

  // Hide "已使用次数" when unlimited or transferred
  document.getElementById('fucg').style.display=showSub?'':'none';
  // Show "是否已使用" checkbox when unlimited and not transferred
  document.getElementById('fucu').style.display=(!showSub&&!isTransfer)?'':'none';
}
function onUsageLimitSub(){

// ---- Multi-Image ----
let _imgGridListenersAttached=false;
function renderImgGrid(){
  const grid=document.getElementById('imgGrid');
  let h='';
  S.imgData.forEach((img,idx)=>{
    h+=`<div class="iu-box">
      <img src="${img}" alt="图片${idx+1}">
      <div class="icl" onclick="event.stopPropagation();removeImg(${idx})"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
    </div>`;
  });
  const n=S.imgData.length;
  h+=`<div class="iu-box drop-zone" id="imgAdd" onclick="document.getElementById('imgi').click()" title="点击或拖拽上传">
    <div class="iph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><div>添加图片${n>0?`（已上传${n}张）`:''}</div></div>
  </div>`;
  grid.innerHTML=h;
  if(!_imgGridListenersAttached){
    _imgGridListenersAttached=true;
    grid.addEventListener('dragover',e=>{e.preventDefault()});
    grid.addEventListener('drop',e=>{
      e.preventDefault();
      if(e.dataTransfer.files.length>0) processImageFiles(e.dataTransfer.files);
    });
  }
}
function processImageFiles(files){
  Array.from(files).forEach(file=>{
    if(!file.type.startsWith('image/')) return;
    const reader=new FileReader();
    reader.onload=function(ev){
      const img=new Image();
      img.onload=function(){
        const c=document.createElement('canvas'),maxW=1600;let w=img.width,h=img.height;
        if(w>maxW){h=(h*maxW)/w;w=maxW}c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        S.imgData.push(c.toDataURL('image/jpeg',0.85));
        renderImgGrid();
      };img.src=ev.target.result;
    };reader.readAsDataURL(file);
  });
}
function handleImages(e){
  if(e.target.files.length>0) processImageFiles(e.target.files);
  e.target.value='';
}
function removeImg(idx){
  S.imgData.splice(idx,1);renderImgGrid();
}
function handlePayImage(e){

  e.target.value='';
  handlePayFile(file);
}
function handlePayFile(file){

      if(w>maxW){h=(h*maxW)/w;w=maxW}c.width=w;c.height=h;
