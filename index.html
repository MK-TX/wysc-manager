// ---- Lightbox ----
let lbImgs=[],lbIdx=0,lbItemName='',lbItemArtist='';
let lbZoom=1,lbPanX=0,lbPanY=0,lbDragging=false,lbDragSX=0,lbDragSY=0,lbDragStartX=0,lbDragStartY=0,lbDidDrag=false,lbBaseCX=0,lbBaseCY=0;
let lbPinchDist=0,lbPinchStartZoom=1,lbIsPinching=false;
function openLb(cid){
  const i=S.items.find(x=>x.id===cid);if(!i)return;
  lbImgs=getImages(i);lbIdx=0;lbItemName=i.name||'';lbItemArtist=i.artist||'';
  if(lbImgs.length===0) return;
  lbResetZoom();
  showLbImg();
  document.getElementById('lbx').style.display='flex';
  renderLbThumbs();
}
// Scroll-wheel zoom on lightbox (gradual multiplicative zoom)
document.getElementById('lbx').addEventListener('wheel',function(e){
  if(document.getElementById('lbx').style.display==='none')return;
  e.preventDefault();
  const factor=e.deltaY<0?1.12:1/1.12;
  const oldZoom=lbZoom;
  lbZoom=Math.max(1,Math.min(8,lbZoom*factor));
  if(lbZoom<=1){
    lbResetZoom();
  }else{
    if(oldZoom<=1){lbPanX=0;lbPanY=0}
    clampLbPan();
    lbApplyZoom();
    if(oldZoom<=1)lbEnablePan();
  }
},{passive:false});
// Pinch-to-zoom for touch devices
document.getElementById('lbx').addEventListener('touchstart',function(e){
  if(document.getElementById('lbx').style.display==='none')return;
  if(e.touches.length===2){
    e.preventDefault();
    lbIsPinching=true;
    lbPinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    lbPinchStartZoom=lbZoom;
  }
},{passive:false});
document.getElementById('lbx').addEventListener('touchmove',function(e){
  if(document.getElementById('lbx').style.display==='none')return;
  if(e.touches.length===2&&lbIsPinching){
    e.preventDefault();
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(lbPinchDist>0){
      const oldZoom=lbZoom;
      lbZoom=Math.max(1,Math.min(8,lbPinchStartZoom*d/lbPinchDist));
      if(lbZoom<=1){
        lbResetZoom();
      }else{
        if(oldZoom<=1){lbPanX=0;lbPanY=0}
        lbApplyZoom();
        if(oldZoom<=1)lbEnablePan();
      }
    }
  }
},{passive:false});
document.getElementById('lbx').addEventListener('touchend',function(e){
  if(e.touches.length<2){lbIsPinching=false;lbPinchDist=0}
},{passive:false});
function lbResetZoom(){
  lbZoom=1;lbPanX=0;lbPanY=0;
  const img=document.getElementById('lbi');
  img.classList.remove('zoomed','dragging');
  img.style.transform='';
  img.style.maxWidth='92vw';
  img.style.maxHeight='85vh';
  img.style.width='';
}
function lbApplyZoom(){
  const img=document.getElementById('lbi');
  if(lbZoom<=1){
    img.classList.remove('zoomed','dragging');
    img.style.transform='';
    img.style.maxWidth='92vw';
    img.style.maxHeight='85vh';
    img.style.width='';
    document.getElementById('lbMinimap').style.display='none';
  }else{
    img.classList.add('zoomed');
    // Remove constraints so image shows at natural resolution (not blurry upscale)
    img.style.maxWidth='none';
    img.style.maxHeight='none';
    img.style.width='auto';
    // Measure actual image center (may differ from viewport center due to thumbs bar, padding, etc.)
    const prevT=img.style.transform; img.style.transform='none';
    const r=img.getBoundingClientRect();
    lbBaseCX=r.left+r.width/2; lbBaseCY=r.top+r.height/2;
    img.style.transform=prevT;
    clampLbPan();
    img.style.transform=`scale(${lbZoom}) translate(${lbPanX}px,${lbPanY}px)`;
    updateLbMinimap();
  }
}
function showLbImg(){
  document.getElementById('lbi').src=lbImgs[lbIdx]||'';
  lbResetZoom();
  renderLbThumbs();
}
function renderLbThumbs(){
  if(lbImgs.length<=1){document.getElementById('lbThumbs').innerHTML='';return}
  document.getElementById('lbThumbs').innerHTML=lbImgs.map((img,idx)=>`<div class="lb-thumb${idx===lbIdx?' active':''}" onclick="event.stopPropagation();lbJump(${idx})"><img src="${img}"></div>`).join('');
}
function lbJump(idx){lbIdx=idx;showLbImg()}
function closeLb(){document.getElementById('lbx').style.display='none';lbImgs=[];lbIdx=0;lbResetZoom();document.getElementById('lbMinimap').style.display='none'}
function updateLbMinimap(){
  const img=document.getElementById('lbi');
  const mini=document.getElementById('lbMinimap');
  if(lbZoom<=1||!img.naturalWidth){mini.style.display='none';return}
  mini.style.display='block';
  document.getElementById('lbMiniImg').src=lbImgs[lbIdx]||'';
  const nw=img.naturalWidth,nh=img.naturalHeight;
  const vpW=window.innerWidth,vpH=window.innerHeight;
  // Visible area in natural pixels from image top-left, accounting for actual image base position
  const visL=nw/2-lbBaseCX/lbZoom-lbPanX, visT=nh/2-lbBaseCY/lbZoom-lbPanY;
  const visW=vpW/lbZoom, visH=vpH/lbZoom;
  const pL=Math.max(0,Math.min(100,visL/nw*100));
  const pT=Math.max(0,Math.min(100,visT/nh*100));
  const pW=Math.max(2,Math.min(100-pL,visW/nw*100));
  const pH=Math.max(2,Math.min(100-pT,visH/nh*100));
  const vp=document.getElementById('lbVport');
  vp.style.left=pL+'%';vp.style.top=pT+'%';
  vp.style.width=pW+'%';vp.style.height=pH+'%';
}
// Minimap drag to quick-navigate (bird's-eye view)
(function(){
  let mmDragging=false,mmStartX=0,mmStartY=0,mmStartPX=0,mmStartPY=0;
  const mm=document.getElementById('lbMinimap');
  const vp=document.getElementById('lbVport');
  function mmToPan(pL,pT){
    const img=document.getElementById('lbi');if(!img||!img.naturalWidth)return;
    const nw=img.naturalWidth,nh=img.naturalHeight;
    const vpW=window.innerWidth,vpH=window.innerHeight;
    lbPanX=nw/2-lbBaseCX/lbZoom-(pL/100)*nw;
    lbPanY=nh/2-lbBaseCY/lbZoom-(pT/100)*nh;
    clampLbPan();
    img.style.transform='scale('+lbZoom+') translate('+lbPanX+'px,'+lbPanY+'px)';
    updateLbMinimap();
  }
  // Drag the viewport rectangle on the minimap
  vp.addEventListener('mousedown',function(e){
    if(lbZoom<=1)return;
    e.preventDefault();e.stopPropagation();
    mmDragging=true;mmStartX=e.clientX;mmStartY=e.clientY;
    mmStartPX=parseFloat(vp.style.left)||0;
    mmStartPY=parseFloat(vp.style.top)||0;
    document.onmousemove=function(ev){
      if(!mmDragging)return;
      const mr=mm.getBoundingClientRect();
      const dx=(ev.clientX-mmStartX)/mr.width*100;
      const dy=(ev.clientY-mmStartY)/mr.height*100;
      const vpWp=parseFloat(vp.style.width)||10, vpHp=parseFloat(vp.style.height)||10;
      const newL=Math.max(0,Math.min(100-vpWp,mmStartPX+dx));
      const newT=Math.max(0,Math.min(100-vpHp,mmStartPY+dy));
      mmToPan(newL,newT);
    };
    document.onmouseup=function(){mmDragging=false;document.onmousemove=null;document.onmouseup=null};
  });
  // Click on minimap background jumps to position
  mm.addEventListener('mousedown',function(e){
    if(lbZoom<=1||mmDragging)return;
    if(e.target===vp)return;
    const img=document.getElementById('lbi');if(!img||!img.naturalWidth)return;
    const mr=mm.getBoundingClientRect();
    const pctX=(e.clientX-mr.left)/mr.width;
    const pctY=(e.clientY-mr.top)/mr.height;
    const vpWp=parseFloat(vp.style.width)||10, vpHp=parseFloat(vp.style.height)||10;
    const newL=Math.max(0,Math.min(100-vpWp,(pctX*100)-vpWp/2));
    const newT=Math.max(0,Math.min(100-vpHp,(pctY*100)-vpHp/2));
    mmToPan(newL,newT);
  });
})();
function clampLbPan(){
  const img=document.getElementById('lbi');if(!img||!img.naturalWidth)return;
  const nw=img.naturalWidth,nh=img.naturalHeight;
  const vpW=window.innerWidth,vpH=window.innerHeight;
  const halfVW=vpW/(2*lbZoom),halfVH=vpH/(2*lbZoom);
  // Use measured base center (accounts for thumbs/padding/flex offsets)
  // Image fits → always center; image larger → allow pan to edges with no whitespace
  const maxX=halfVW>=nw/2?0:(nw/2-lbBaseCX/lbZoom);
  const minX=halfVW>=nw/2?0:((vpW-lbBaseCX)/lbZoom-nw/2);
  const maxY=halfVH>=nh/2?0:(nh/2-lbBaseCY/lbZoom);
  const minY=halfVH>=nh/2?0:(vpH-lbBaseCY)/lbZoom-nh/2;
  lbPanX=Math.max(minX,Math.min(maxX,lbPanX));
  lbPanY=Math.max(minY,Math.min(maxY,lbPanY));
}
function lbToggleZoom(e){
  if(e)e.stopPropagation();
  // Suppress click after drag
  if(lbDidDrag){lbDidDrag=false;return}
  if(lbZoom>1){
    lbResetZoom();
  }else{
    lbZoom=2;
    lbApplyZoom();
    lbEnablePan();
  }
}
function lbEnablePan(){
  const img=document.getElementById('lbi');
  // Mouse drag to pan
  img.onmousedown=function(ev){
    if(lbZoom<=1)return;
    ev.preventDefault();
    lbDragging=true;lbDidDrag=false;
    img.classList.add('dragging');
    lbDragSX=ev.clientX;lbDragSY=ev.clientY;
    lbDragStartX=lbPanX;lbDragStartY=lbPanY;
    document.onmousemove=function(ev2){
      if(!lbDragging)return;
      lbDidDrag=true;
      lbPanX=lbDragStartX-(ev2.clientX-lbDragSX)/lbZoom;
      lbPanY=lbDragStartY-(ev2.clientY-lbDragSY)/lbZoom;
      clampLbPan();
      img.style.transform=`scale(${lbZoom}) translate(${lbPanX}px,${lbPanY}px)`;
      updateLbMinimap();
    };
    document.onmouseup=function(){
      lbDragging=false;
      img.classList.remove('dragging');
      document.onmousemove=null;document.onmouseup=null;
    };
  };
  // Touch support (single-finger pan; pinch handled by container)
  img.ontouchstart=function(ev){
    if(lbZoom<=1||lbIsPinching||ev.touches.length>1)return;
    ev.preventDefault();
    const t=ev.touches[0];
    lbDragging=true;lbDidDrag=false;
    lbDragSX=t.clientX;lbDragSY=t.clientY;
    lbDragStartX=lbPanX;lbDragStartY=lbPanY;
  };
  img.ontouchmove=function(ev){
    if(!lbDragging||lbIsPinching)return;
    ev.preventDefault();
    const t=ev.touches[0];
    lbDidDrag=true;
    lbPanX=lbDragStartX-(t.clientX-lbDragSX)/lbZoom;
    lbPanY=lbDragStartY-(t.clientY-lbDragSY)/lbZoom;
    clampLbPan();
    img.style.transform=`scale(${lbZoom}) translate(${lbPanX}px,${lbPanY}px)`;
    updateLbMinimap();
  };
  img.ontouchend=function(){lbDragging=false};
}
// ---- Lightbox context menu (copy / download) ----
function lbContextMenu(e){
  e.preventDefault();
  const menu=document.getElementById('lbCtxMenu');
  menu.style.display='block';
  menu.style.left=Math.min(e.clientX,window.innerWidth-160)+'px';
  menu.style.top=Math.min(e.clientY,window.innerHeight-100)+'px';
}
function lbCopy(){
  const url=lbImgs[lbIdx];if(!url)return;
  document.getElementById('lbCtxMenu').style.display='none';
  // Try fetch→blob first (works for both http and data URLs)
  function doCopy(blob){
    try{
      navigator.clipboard.write([new ClipboardItem({[blob.type]:blob})]).then(
        ()=>st('图片已复制到剪贴板'),
        ()=>st('复制失败，请尝试下载','err')
      );
    }catch(e){st('复制失败','err')}
  }
  // Canvas-based copy (more reliable cross-browser)
  function canvasCopy(){
    const img=new Image();
    img.onload=function(){
      try{
        const c=document.createElement('canvas');
        c.width=img.naturalWidth||img.width;c.height=img.naturalHeight||img.height;
        c.getContext('2d').drawImage(img,0,0);
        c.toBlob(function(b){
          if(!b){st('复制失败','err');return}
          doCopy(b);
        },'image/png');
      }catch(e){st('复制失败','err')}
    };
    img.onerror=function(){st('图片加载失败','err')};
    img.src=url;
  }
  if(!url.startsWith('data:')){
    fetch(url).then(r=>r.blob()).then(b=>doCopy(b)).catch(()=>canvasCopy());
  }else{
    canvasCopy();
  }
}
function lbDownload(){
  const url=lbImgs[lbIdx];if(!url)return;
  const a=document.createElement('a');
  a.href=url;
  const ext=url.startsWith('data:')?'.'+((url.match(/data:image\/(\w+)/)||[])[1]||'webp'):'.jpg';
  a.download=(lbItemArtist||'未知画师')+'_'+(lbItemName||'未知素材')+ext;
  a.click();
  st('已下载');
  document.getElementById('lbCtxMenu').style.display='none';
}

// ---- CSV parsing ----
function parseCSV(text){
  const rows=[],lines=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  for(let line of lines){
    if(!line.trim()) continue;
    const cols=[],chars=[...line];let i=0,col='';
    while(i<chars.length){
      if(chars[i]==='"'){i++;while(i<chars.length){if(chars[i]==='"'){if(i+1<chars.length&&chars[i+1]==='"'){col+='"';i+=2}else{i++;break}}else{col+=chars[i];i++}}}
      else if(chars[i]===','||chars[i]==='\t'){cols.push(col.trim());col='';i++}
      else{col+=chars[i];i++}
    }
    cols.push(col.trim());
    if(cols.some(c=>c)) rows.push(cols);
  }
  if(rows.length>0&&rows[0].length===1&&rows[0][0].includes('\t')) return parseCSV(text.replace(/\t/g,','));
  return rows;
}

// ---- .xlsx parsing ----
async function parseXLSX(buf){
  const entries=await parseZIP(buf);
  if(!entries) throw new Error('无法解析 ZIP 结构');

  // Find key files
  const getEntry=n=>entries.find(e=>e.name===n||e.name.endsWith('/'+n));
  const getEntryStartsWith=prefix=>entries.filter(e=>e.name.startsWith(prefix));

  const ssEntry=getEntry('xl/sharedStrings.xml');
  const sheetEntry=getEntry('xl/worksheets/sheet1.xml');
  if(!sheetEntry) throw new Error('未找到工作表');

  // Parse shared strings
  let sharedStrings=[];
  if(ssEntry){ try{
    const ssText=dec(new Uint8Array(ssEntry.data));
    const ssDoc=new DOMParser().parseFromString(ssText,'text/xml');
    ssDoc.querySelectorAll('si>t,si>r>t').forEach(t=>sharedStrings.push(t.textContent||''));
  }catch(e){} }

  // Parse sheet data
  const sheetText=dec(new Uint8Array(sheetEntry.data));
  const sheetDoc=new DOMParser().parseFromString(sheetText,'text/xml');
  const rows=[],rowEls=sheetDoc.querySelectorAll('sheetData>row');
  let maxCol=0;
  rowEls.forEach(rowEl=>{
    const r=parseInt(rowEl.getAttribute('r'))||0;
    const cells=[];let colIdx=0;
    rowEl.querySelectorAll('c').forEach(cEl=>{
      const ref=cEl.getAttribute('r')||'';
      const m=ref.match(/^([A-Z]+)(\d+)$/);
      if(m){ colIdx=colRefToNum(m[1])-1; }
      const t=cEl.getAttribute('t');
      let val='';
      if(t==='s'){
        const vi=parseInt(cEl.querySelector('v')?.textContent);
        val=sharedStrings[vi]||'';
      }else{
        val=cEl.querySelector('v')?.textContent||'';
        // Also check inlineStr
        if(!val&&t==='inlineStr') val=cEl.querySelector('is>t')?.textContent||'';
      }
      cells[colIdx]=val;
      if(colIdx+1>maxCol) maxCol=colIdx+1;
      colIdx++;
    });
    // Pad to maxCol
    while(cells.length<maxCol) cells.push('');
    rows.push({row:r, cells});
  });

  // Try to extract images
  const imgMap=new Map(); // rowIndex -> [base64 strings]
  try{
    // Find sheet relationships
    const sheetRelsEntry=getEntry('xl/worksheets/_rels/sheet1.xml.rels');
    let drawingRId='';
    if(sheetRelsEntry){
      const relsText=dec(new Uint8Array(sheetRelsEntry.data));
      const relsDoc=new DOMParser().parseFromString(relsText,'text/xml');
      relsDoc.querySelectorAll('Relationship').forEach(rel=>{
        if((rel.getAttribute('Type')||'').includes('drawing')) drawingRId=rel.getAttribute('Id')||'';
      });
    }

    if(drawingRId){
      // Find drawing relationships
      const drawRelsEntry=getEntry('xl/drawings/_rels/drawing1.xml.rels');
      const drawEntry=getEntry('xl/drawings/drawing1.xml');
      if(drawRelsEntry&&drawEntry){
        const drawRelsText=dec(new Uint8Array(drawRelsEntry.data));
        const drawRelsDoc=new DOMParser().parseFromString(drawRelsText,'text/xml');
        const ridToFile={};
        drawRelsDoc.querySelectorAll('Relationship').forEach(rel=>{
          ridToFile[rel.getAttribute('Id')||'']=(rel.getAttribute('Target')||'').replace('../media/','');
        });

        const drawText=dec(new Uint8Array(drawEntry.data));
        const drawDoc=new DOMParser().parseFromString(drawText,'text/xml');
        drawDoc.querySelectorAll('twoCellAnchor,oneCellAnchor').forEach(anchor=>{
          const fromEl=anchor.querySelector('from');
          if(!fromEl) return;
          const row=parseInt(fromEl.querySelector('row')?.textContent)||0;
          const blipEl=anchor.querySelector('blip');
          if(!blipEl) return;
          const embed=blipEl.getAttribute('r:embed')||blipEl.getAttribute('embed')||'';
          const imgFile=ridToFile[embed];
          if(!imgFile) return;

          // Find image data in ZIP
          const imgEntry=getEntry('xl/media/'+imgFile);
          if(!imgEntry||!imgEntry.data) return;
          let ext=imgFile.split('.').pop().toLowerCase();
          if(!['png','jpg','jpeg','gif','webp'].includes(ext)) ext='png';
          const mime=ext==='jpg'?'jpeg':ext;
          const b64='data:image/'+mime+';base64,'+btoa(String.fromCharCode(...new Uint8Array(imgEntry.data)));

          if(!imgMap.has(row)) imgMap.set(row,[]);
          imgMap.get(row).push(b64);
        });
      }
    }
  }catch(e){ /* Images optional */ }

  // Determine headers: first row is always header row
  const headerRow=rows.length>0?rows[0].cells:['A','B','C','D','E'];
  const dataRows=rows.slice(1).map(r=>r.cells);

  return {headers:headerRow, data:dataRows, imgMap};
}

// ---- ZIP parsing ----
async function parseZIP(buf){
  const view=new DataView(buf);
  // Find EOCD
  let eocdOff=-1;
  const maxSearch=Math.min(buf.byteLength,65557);
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-maxSearch);i--){
    if(view.getUint32(i,true)===0x06054b50){eocdOff=i;break}
  }
  if(eocdOff<0) return null;

  const entriesCount=view.getUint16(eocdOff+10,true);
  const cdOff=view.getUint32(eocdOff+16,true);

  // Also check ZIP64
  let cdPos=cdOff;
  if(entriesCount===0xFFFF||cdOff===0xFFFFFFFF){
    // Try ZIP64 EOCD locator
    for(let i=eocdOff-20;i>=0;i--){
      if(view.getUint32(i,true)===0x07064b50){
        const zip64EOCDOff=Number(view.getBigUint64(i+8,true));
        if(view.getUint32(zip64EOCDOff,true)===0x06064b50){
          cdPos=Number(view.getBigUint64(zip64EOCDOff+48,true));
        }
        break;
      }
    }
  }

  const entries=[];
  let pos=cdPos;
  for(let i=0;i<entriesCount&&pos<buf.byteLength-46;i++){
    if(view.getUint32(pos,true)!==0x02014b50) break;
    const method=view.getUint16(pos+10,true);
    const compSize=view.getUint32(pos+20,true);
    const uncompSize=view.getUint32(pos+24,true);
    const nameLen=view.getUint16(pos+28,true);
    const extraLen=view.getUint16(pos+30,true);
    const commentLen=view.getUint16(pos+32,true);
    const lhOff=view.getUint32(pos+42,true);
    const name=dec(new Uint8Array(buf,pos+46,nameLen));

    // Read local header to find data offset
    const lhNameLen=view.getUint16(lhOff+26,true);
    const lhExtraLen=view.getUint16(lhOff+28,true);
    const dataOff=lhOff+30+lhNameLen+lhExtraLen;

    entries.push({name,method,compSize,uncompSize,dataOff});
    pos+=46+nameLen+extraLen+commentLen;
  }

  // Decompress
  for(const e of entries){
    if(e.compSize===0&&e.uncompSize===0){e.data=new Uint8Array(0);continue}
    const raw=new Uint8Array(buf,e.dataOff,e.compSize||e.uncompSize);
    if(e.method===0){e.data=raw}
    else if(e.method===8){
      try{
        const ds=new DecompressionStream('deflate-raw');
        const writer=ds.writable.getWriter();
        writer.write(raw);writer.close();
        const ab=await new Response(ds.readable).arrayBuffer();
        e.data=new Uint8Array(ab);
      }catch(ex){e.data=raw}
    }else{e.data=raw}
  }
  return entries;
}

function dec(arr){return new TextDecoder().decode(arr)}
function colRefToNum(ref){let n=0;for(let i=0;i<ref.length;i++)n=n*26+(ref.charCodeAt(i)-64);return n}

function handleXFile(e){
  const file=e.target.files[0];e.target.value='';if(!file)return;

async function handleXLSXImport(file){
  document.getElementById('xidrop').innerHTML='<div style="text-align:center;padding:20px"><div style="font-size:14px;color:var(--text2);margin-bottom:8px">正在解析 .xlsx 文件…</div><div style="font-size:12px;color:var(--text2)">包含图片可能需要几秒钟</div></div>';
  try{
    const buf=await file.arrayBuffer();
    const result=await parseXLSX(buf);
    if(!result.data||result.data.length===0){st('文件中没有数据行','err');openExcelImport();return}

    xiHeaders=result.headers;
    xiData=result.data;
    xiImages=result.imgMap; // Map<rowIndex, base64[]>
    // rowIndex is the sheet row number (1-based), data rows start at sheet row 2
    // So xiData[i] corresponds to sheet row i+2

    document.getElementById('xidrop').style.display='none';
    document.getElementById('ximap').style.display='';
    document.getElementById('ximdf').style.display='flex';
    buildXIMap();
    buildXIPreview();
  }catch(err){
    st('解析 .xlsx 失败：'+err.message,'err');
    openExcelImport();
  }
}

function handleCSVImport(file){
  const reader=new FileReader();
  reader.onload=function(ev){
    let text=ev.target.result;
    if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
    const rows=parseCSV(text);
    if(rows.length<2){st('文件内容不足','err');return}
    xiHeaders=rows[0];xiData=rows.slice(1);xiImages=null;
    document.getElementById('xidrop').style.display='none';
    document.getElementById('ximap').style.display='';
    document.getElementById('ximdf').style.display='flex';
    buildXIMap();
    buildXIPreview();
  };
  reader.readAsText(file,'UTF-8');
}

      };
      S.items.push(item);imported++;

  });
  sv();closeExcelImport();renderAll();st(`导入完成：${imported} 条成功${skipped>0?`，${skipped} 条跳过`:''}`);
}

        if(data.sourceGroup) S.sourceGroup=data.sourceGroup;
        migrateImages();
        sv();renderAll();st(`导入 ${data.items?data.items.length:0} 条素材`);
      }catch(err){st('导入失败：格式不正确','err')}
    };reader.readAsText(file);
  });
}
function confirmClearAll(){
  confirm(`清空全部（${S.shops.length}个店铺、${S.persons.length}个个人、${S.items.length}条素材）？不可恢复！`,()=>{S.shops=[];S.persons=[];S.items=[];S.selType='shop';S.selName='all';S.pinned={};S.groups={shop:[],person:[]};S.sourceGroup={};selectedGroup='all';sv();renderAll();st('已全部清空')});
}

// ---- Confirm/Toast ----
function confirm(text,cb){document.getElementById('ct').textContent=text;S._cb=cb;document.getElementById('co').style.display='flex';document.getElementById('cb').onclick=()=>{closeConfirm();if(S._cb)S._cb();S._cb=null}}
function closeConfirm(){document.getElementById('co').style.display='none'}
function st(msg,type){const el=document.getElementById('tst');el.textContent=msg;el.style.display='block';el.style.background=type==='err'?'var(--danger)':'#1e293b';clearTimeout(el._t);el._t=setTimeout(()=>{el.style.display='none'},2500)}

// ---- Keyboard ----
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeItemModal();closeLb();closeConfirm();closeExcelImport();hideCtxMenu();closeSourceModal();closeGroupModal();closeFilterModal()}});

// ---- Drag & drop for import ----
document.getElementById('xidrop').addEventListener('dragover',e=>{e.preventDefault();e.currentTarget.style.borderColor='var(--primary)'});
document.getElementById('xidrop').addEventListener('dragleave',e=>{e.currentTarget.style.borderColor='var(--border)'});
document.getElementById('xidrop').addEventListener('drop',e=>{
  e.preventDefault();e.currentTarget.style.borderColor='var(--border)';
  const file=e.dataTransfer.files[0];if(!file)return;
  const inp=document.getElementById('xii');
  const dt=new DataTransfer();dt.items.add(file);inp.files=dt.files;
  handleXFile({target:inp});
});

// ---- Init ----
// Request persistent storage to prevent browser from evicting data
if(navigator.storage&&navigator.storage.persist){
  navigator.storage.persist().then(()=>{}).catch(()=>{});
}

ld(); // load from localStorage (fallback / migration source)

// Load all data from IndexedDB (primary storage, no size limit)
idbInit().then(()=>{
  return Promise.all([
    idbGet('shops'),idbGet('persons'),idbGet('items'),
    idbGet('state'),idbGet('pinned'),idbGet('groups'),
    idbGet('sourceGroup'),idbGet('groupCollapsed')
  ]);
}).then(([shops,persons,items,state,pinned,groups,sourceGroup,groupCollapsed])=>{
  // Load from IndexedDB; fall back to localStorage data if IDB is empty (first-time migration)
  if(shops!==null) S.shops=shops;
  if(persons!==null) S.persons=persons;
  if(items!==null) S.items=items;
  if(state!==null){
    S.selType=state.selType||'shop'; S.selName=state.selName||'all';
    selectedGroup = state.selectedGroup !== undefined ? state.selectedGroup : 'all';
    S._filterCat=state.filterCat||'all'; S._filterUsed=state.filterUsed||'all';
    S._filterSort=state.filterSort||'time_desc'; S._filterQuery=state.filterQuery||'';
    if(state.S_filter){ S_filter=state.S_filter; if(!S_filter.status) S_filter.status=[]; }
  }
  if(pinned!==null) S.pinned=pinned;
  if(groups!==null) S.groups=groups;
  if(sourceGroup!==null) S.sourceGroup=sourceGroup;
  if(groupCollapsed!==null) S.groupCollapsed=groupCollapsed;
  // If IDB was empty but localStorage had data, migrate everything to IDB
  if(shops===null&&persons===null&&items===null&&(S.shops.length||S.persons.length||S.items.length)){
    sv(); // This saves everything to IDB and cleans up localStorage
  }
  startApp();
}).catch(()=>{
  // IndexedDB failed entirely, use localStorage fallback
  startApp();
});

function startApp(){
  migrateImages();
  // Restore filter state BEFORE first render to prevent overwrite
  if(S._filterSort&&S._filterSort!=='time_desc'){const fs=document.getElementById('fsort');if(fs)fs.value=S._filterSort}
  if(S._filterQuery){const q=document.getElementById('q');if(q)q.value=S._filterQuery}
  renderAll();
  autoExtractPersons();
  document.getElementById('stab-shop').classList.toggle('active',S.selType==='shop');
  document.getElementById('stab-person').classList.toggle('active',S.selType==='person');
  renderAll(true);
  setInterval(updateDataBanner,30000);
}
</script>
</body>
